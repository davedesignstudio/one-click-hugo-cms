<div class="pv5 pv6-l ph3 bg-center cover relative" style="background-image: linear-gradient(180deg, rgba(18,32,26,0.35), rgba(18,32,26,0.72)), url('{{.imageUrl}}')">
  <div class="mw7 center ph3">
    <div class="db mb3">
      <p class="brand-wordmark f6 primary mb2" style="letter-spacing: 0.18em;">Anthem</p>
      <h1 class="f2 f1-l b di lh-title mb3 white mw7 font-display" style="text-shadow: 0 2px 24px rgba(0,0,0,0.35);">
        {{.title}}
      </h1>
      {{ if .subtitle }}
      <p class="f4 di lh-title mb3 white mw6" style="opacity: 0.9;">
        {{.subtitle}}
      </p>
      {{ end }}
    </div>
  </div>
</div>
