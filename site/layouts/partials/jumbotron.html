<div class="hero pv6 pv7-l ph3 bg-center cover relative" style="background-image: linear-gradient(120deg, rgba(18,28,22,.55), rgba(18,28,22,.2)), url('{{.imageUrl}}')">
  <div class="mw7 center ph3">
    <div class="db mb3 hero-copy">
      <div class="mw7 relative bg-fix-primary mb3">
        <h1 class="f2 f1-l b di lh-title mb3 white mw6 bg-primary display">
          {{.title}}
        </h1>
      </div>
      <div class="mw7 relative bg-fix-primary">
        {{ if .subtitle }}
        <p class="b f4 di lh-title mb3 white mw6 bg-primary">
          {{.subtitle}}
        </p>
        {{ end }}
      </div>
    </div>
  </div>
</div>
