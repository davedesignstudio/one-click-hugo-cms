<div class="pv5 pv6-l ph3 bg-center cover relative anthem-hero" style="background-image: linear-gradient(120deg, rgba(28,25,23,.55), rgba(31,74,58,.35)), url('{{.imageUrl}}')">
  <div class="mw7 center ph3">
    <div class="db mb3 anthem-hero-copy">
      <div class="mw7 relative bg-fix-primary mb3">
        <h1 class="f2 f1-l b di lh-title mb3 white mw6 bg-primary anthem-display">
          {{.title}}
        </h1>
      </div>
      <div class="mw7 relative bg-fix-primary">
        {{ if .subtitle }}
        <p class="b f4 di lh-title mb3 white mw6 bg-primary">
          {{.subtitle}}
        </p>
        {{ end }}
      </div>
    </div>
  </div>
</div>
